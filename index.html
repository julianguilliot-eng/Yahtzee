<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Yahtzee — Table du soir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --felt-dark:#0a2a20;
    --felt:#0f3d2e;
    --felt-light:#154a37;
    --wood-light:#4a2f1f;
    --gold:#cda548;
    --gold-bright:#e9c874;
    --ivory:#f6efe1;
    --ink:#0d1f18;
    --ruby:#a13d3d;
    --line: rgba(205,165,72,0.25);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; width:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(233,200,116,0.06), transparent 45%),
      radial-gradient(ellipse at 80% 100%, rgba(233,200,116,0.05), transparent 50%),
      linear-gradient(160deg, var(--felt-dark), var(--felt) 45%, var(--felt-dark));
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:var(--ink);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--wood-light); border-radius:10px;}
  button{font-family:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  .tray-3d canvas{ touch-action:none; } /* les gestes sur les dés ne doivent jamais déclencher de scroll/zoom iPad */
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

  .app{ display:grid; grid-template-columns: clamp(250px, 23vw, 380px) 1fr; height:100vh; max-width:1800px; margin:0 auto; position:relative; }

  .sidebar-backdrop, .score-toggle-btn, .sidebar-close-btn{ display:none; }

  /* ---------- Verrouillage de l'orientation : paysage uniquement ---------- */
  .rotate-lock{ display:none; }
  @media (orientation: portrait){
    .app{ display:none; }
    .rotate-lock{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
      position:fixed; inset:0; height:100vh; background:var(--felt-dark); color:var(--ivory); z-index:100; text-align:center; padding:30px;
    }
    .rotate-lock .icon{ font-size:52px; animation:rotateHint 1.8s ease-in-out infinite; }
    .rotate-lock p{ font-family:'Space Mono', monospace; font-size:13px; color:rgba(246,239,225,0.6); max-width:320px; margin:0; }
    @keyframes rotateHint{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-90deg); } }
  }

  /* écrans étroits mais en paysage (téléphone à plat) : on resserre l'interface plutôt que de la découper */
  @media (max-width: 760px) and (orientation: landscape){
    .app{ grid-template-columns: 210px 1fr; }
    .hud-top{ top:10px; left:12px; right:12px; }
    .hud-right{ gap:6px; }
    .hud-title{ font-size:17px; }
    .hud-round{ font-size:9px; padding:5px 9px; }
    .fs-btn{ width:28px; height:28px; font-size:12px; }
    .new-game-btn-top{ font-size:9px; padding:6px 9px; }
    .hud-turn{ top:52px; padding:5px 14px 5px 12px; }
    .hud-turn .who{ font-size:13px; }
    .hud-turn .lbl{ display:none; }
    .roll-btn{ font-size:14px; padding:10px 20px; }
    .table-header h1{ font-size:22px; }
    .setup-card{ padding:12px 16px; }
    .setup-card h2{ font-size:18px; }
    .score-table{ font-size:10px; }
  }

  /* ---------- SIDEBAR : TABLEAU DE SCORES ---------- */
  .sidebar{ position:sticky; top:0; align-self:start; height:100vh; padding:16px 14px 16px 18px; border-right:1px solid var(--line); background:linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.05)); overflow-y:auto; display:flex; flex-direction:column; justify-content:flex-end; }
  .score-title{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size:15px; letter-spacing:0.02em; color:var(--gold-bright); margin:0 0 8px 2px; flex-shrink:0; }
  .score-wrap{ border:1px solid var(--line); border-radius:9px; overflow:auto; background:rgba(0,0,0,0.15); max-width:100%; flex:0 1 auto; max-height:calc(100vh - 40px); }
  table.score-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .score-table thead th{ position:sticky; top:0; z-index:2; background:var(--felt-dark); }
  .score-table th, .score-table td{ padding:5px 5px; text-align:center; border-bottom:1px solid rgba(205,165,72,0.12); }
  .score-table th.cat-col, .score-table td.cat-col{ text-align:left; font-family:'Inter'; font-weight:500; color:rgba(246,239,225,0.75); font-size:12px; white-space:nowrap; padding-left:9px; min-width:106px; }
  .score-table .player-head{ font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.03em; color:var(--gold-bright); max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:7px 4px; }
  .score-table .player-head.active-col{ background:rgba(205,165,72,0.14); box-shadow: inset 0 2px 0 var(--gold), inset 0 -2px 0 var(--gold); }
  .score-table td.cell{ font-family:'Space Mono', monospace; font-size:12.5px; color:var(--ivory); min-width:40px; position:relative; }
  .score-table td.cell.active-col{ background:rgba(205,165,72,0.08); }
  .score-table td.cell.empty{ color:rgba(246,239,225,0.25); }
  .score-table td.cell.choosable{ min-width:60px; padding-right:9px; }
  .score-table tr.section-divider td{ border-bottom:1px solid var(--line); padding:0; height:1px; }
  .score-table tr.subtotal td, .score-table tr.total-row td{ background:#0d251c; font-weight:700; }
  .score-table tr.total-row td{ position:sticky; bottom:0; z-index:2; background:#1c1305; color:var(--gold-bright); font-size:13.5px; border-top:1px solid var(--gold); box-shadow:0 -6px 10px -6px rgba(0,0,0,0.5); }
  .cat-hint{ display:block; font-size:9px; color:rgba(246,239,225,0.32); font-weight:400; margin-top:0px; }
  .score-pick{
    font-family:'Space Mono', monospace; font-weight:700; font-size:10.5px; padding:2px 7px; min-width:22px; border-radius:5px; border:1px solid var(--gold);
    background:linear-gradient(160deg, var(--gold-bright), var(--gold)); color:var(--ink); cursor:pointer; line-height:1.3;
    transform: translate(4px,-2px); box-shadow:0 3px 7px rgba(205,165,72,0.45); transition: transform .12s ease, box-shadow .12s ease; position:relative; z-index:3;
  }
  .score-pick:hover{ transform:translate(5px,-5px) scale(1.08); box-shadow:0 6px 14px rgba(205,165,72,0.55);}
  .score-pick:active{ transform:translate(5px,-1px) scale(0.97); }
  .score-pick.zero{ background:rgba(0,0,0,0.3); color:rgba(246,239,225,0.55); border-color:var(--line); box-shadow:none;}
  .cell-ghost{ color:rgba(246,239,225,0.18); font-size:12px; }
  .chip{ font-family:'Space Mono', monospace; font-size:10px; border:1px solid var(--line); background:rgba(0,0,0,0.2); color:rgba(246,239,225,0.7); padding:4px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; }
  .chip .best{color:var(--gold-bright);}
  .known-players{ display:flex; flex-wrap:wrap; gap:6px; }
  .btn{ border:1px solid var(--line); background:rgba(0,0,0,0.2); color:var(--ivory); padding:7px 11px; border-radius:8px; font-size:11.5px; font-weight:600; transition:all .15s ease; letter-spacing:0.01em; }
  .btn:hover{border-color:var(--gold); background:rgba(205,165,72,0.1);}
  .btn.gold{ background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .btn.gold:hover{ background:var(--gold-bright);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .new-game-btn-top{ font-size:11px; padding:8px 14px; border-radius:20px; background:rgba(6,20,15,0.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .new-game-btn-top:hover{ background:rgba(6,20,15,0.6); }

  /* ---------- MAIN : plein écran, sans cadre ---------- */
  .main{ position:relative; height:100vh; overflow:hidden; }
  .screen-pad{ padding:16px 30px; height:100%; overflow:hidden; display:flex; flex-direction:column; justify-content:center; align-items:stretch; }
  .table-header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; gap:14px; flex-shrink:0; }
  .table-header h1{ font-family:'Fraunces', serif; font-weight:700; font-size:30px; margin:0; letter-spacing:-0.01em; }
  .table-header .tagline{ font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(246,239,225,0.4); margin-top:4px; }

  .setup-card{ max-width:560px; width:100%; margin:0 auto 12px; padding:20px 32px; background:linear-gradient(160deg, rgba(0,0,0,0.25), rgba(0,0,0,0.1)); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .setup-card h2{ font-family:'Fraunces', serif; font-size:28px; margin:0 0 6px; }
  .setup-card p.desc{color:rgba(246,239,225,0.55); font-size:13.5px; margin:0 0 24px;}
  .add-row{display:flex; gap:8px; margin-bottom:14px;}
  .add-row input{ flex:1; padding:11px 14px; border-radius:9px; border:1px solid var(--line); background:rgba(0,0,0,0.25); color:var(--ivory); font-size:14px; font-family:inherit; }
  .add-row input::placeholder{color:rgba(246,239,225,0.35);}
  .player-list{display:flex; flex-direction:column; gap:8px; margin:18px 0;}
  .player-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border:1px solid var(--line); border-radius:9px; background:rgba(0,0,0,0.18); }
  .player-row .name{font-family:'Space Mono', monospace; font-size:13.5px;}
  .player-row .remove{ background:none; border:none; color:rgba(246,239,225,0.4); font-size:16px; line-height:1; }
  .player-row .remove:hover{color:var(--ruby);}
  .recent-title{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(246,239,225,0.4); margin:20px 0 8px;}

  .end-banner{ max-width:560px; width:100%; margin:0 auto; text-align:center; padding:28px; border:1px solid var(--gold); border-radius:18px; background:radial-gradient(ellipse at 50% 0%, rgba(205,165,72,0.14), rgba(0,0,0,0.15)); box-shadow:var(--shadow); }
  .end-banner .crown{font-size:34px; margin-bottom:10px;}
  .end-banner h2{font-family:'Fraunces', serif; font-size:30px; margin:0 0 6px;}
  .end-banner .score-final{font-family:'Space Mono', monospace; color:var(--gold-bright); font-size:15px; margin-bottom:20px;}
  .end-list{ text-align:left; display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .end-list .row{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 12px; border:1px solid var(--line); border-radius:8px;}
  .end-list .row.win{border-color:var(--gold); background:rgba(205,165,72,0.1);}
  .empty-state{ text-align:center; padding:60px 20px; color:rgba(246,239,225,0.4); font-family:'Space Mono', monospace; font-size:12.5px;}

  /* ---------- Sélecteur de jeu ---------- */
  .game-select-grid{ display:flex; gap:16px; max-width:900px; margin:0 auto; flex-wrap:wrap; justify-content:center; }
  .game-card{
    flex:1 1 220px; max-width:260px; text-align:left; padding:22px 20px; border-radius:16px;
    background:linear-gradient(160deg, rgba(0,0,0,0.25), rgba(0,0,0,0.1)); border:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; transition:all .15s ease; box-shadow:var(--shadow);
  }
  .game-card:hover{ border-color:var(--gold); transform:translateY(-3px); }
  .game-card-tag{ font-family:'Space Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-bright); }
  .game-card-title{ font-family:'Fraunces', serif; font-weight:700; font-size:22px; }
  .game-card-desc{ font-family:'Inter'; font-size:12.5px; color:rgba(246,239,225,0.6); line-height:1.4; }

  /* ---------- Panneau 421 (jetons) ---------- */
  .p421-phase{ font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-bright); text-align:center; padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; background:rgba(0,0,0,0.2); }
  .p421-pot{ display:block; font-size:9px; color:rgba(246,239,225,0.5); margin-top:2px; text-transform:none; letter-spacing:0; }
  .p421-row{ display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid rgba(205,165,72,0.12); }
  .p421-row.active{ background:rgba(205,165,72,0.1); border-radius:8px; }
  .p421-name{ flex:1 1 auto; font-family:'Inter'; font-weight:600; font-size:12.5px; color:var(--ivory); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p421-count{ font-family:'Space Mono', monospace; font-size:13px; color:var(--gold-bright); font-weight:700; min-width:22px; text-align:right; }
  .chip-stack{ position:relative; height:22px; flex-shrink:0; }
  .chip{
    position:absolute; width:15px; height:15px; border-radius:50%; left:0;
    background:radial-gradient(circle at 32% 28%, var(--gold-bright), var(--gold) 55%, #8a6a24 100%);
    border:1px solid #5f4614; box-shadow:0 1px 2px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.12);
  }
  .chip-extra{ font-family:'Space Mono', monospace; font-size:9.5px; color:rgba(246,239,225,0.55); align-self:center; }
  .p421-log{ font-family:'Space Mono', monospace; font-size:9.5px; color:rgba(246,239,225,0.4); padding:8px 8px 2px; line-height:1.5; }
  .p421-section-title{ font-family:'Space Mono', monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(246,239,225,0.4); margin:10px 0 4px; padding:0 8px; }
  .p421-turn-result{ display:flex; align-items:center; gap:7px; padding:6px 8px; border-bottom:1px solid rgba(205,165,72,0.08); }
  .p421-turn-name{ flex:0 0 auto; font-family:'Inter'; font-size:11px; font-weight:600; color:var(--ivory); min-width:52px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p421-turn-combo{ flex:1 1 auto; font-size:10px; color:var(--gold-bright); font-family:'Inter'; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p421-turn-rolls{ font-size:8.5px; color:rgba(246,239,225,0.4); font-family:'Space Mono',monospace; white-space:nowrap; flex-shrink:0; }
  .mini-dice-row{ display:flex; gap:2px; flex-shrink:0; }
  .mini-die{
    width:15px; height:15px; background:var(--ivory); border-radius:3px; flex-shrink:0;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:2px;
    box-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .mini-pip{ width:2.4px; height:2.4px; border-radius:50%; background:var(--ink); align-self:center; justify-self:center; }

  /* ---------- TABLE 3D plein écran (sans cadre) ---------- */
  .game-screen{ position:absolute; inset:0; }
  .tray-3d{ position:absolute; inset:0; }
  .tray-3d canvas{ display:block; width:100%; height:100%; }
  .tray-3d::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 42%, transparent 60%, rgba(6,20,15,0.22) 100%);
  }
  .loading3d{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Space Mono', monospace; font-size:11px; color:rgba(246,239,225,0.4); letter-spacing:0.1em; z-index:4; }
  .hud-held{
    position:absolute; transform:translate(-50%,-140%); z-index:5; pointer-events:none;
    font-family:'Space Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(233,200,116,0.55); white-space:nowrap;
  }

  .hud-top{ position:absolute; top:22px; left:28px; right:28px; display:flex; justify-content:space-between; align-items:flex-start; z-index:6; pointer-events:none; }
  .hud-title{ font-family:'Fraunces', serif; font-weight:700; font-style:italic; font-size:24px; text-shadow:0 3px 14px rgba(0,0,0,0.55); }
  .hud-right{ display:flex; align-items:center; gap:10px; pointer-events:auto; }
  .hud-round{ font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; background:rgba(6,20,15,0.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--line); padding:8px 15px; border-radius:20px; color:var(--gold-bright); white-space:nowrap; }
  .fs-btn{ background:rgba(6,20,15,0.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--line); color:var(--ivory); width:34px; height:34px; border-radius:50%; font-size:15px; display:flex; align-items:center; justify-content:center; transition:all .15s ease; }
  .fs-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

  .hud-turn{ position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:6; pointer-events:none;
    background:rgba(6,20,15,0.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--gold); border-radius:30px; padding:8px 22px 8px 18px; display:flex; align-items:center; gap:9px; box-shadow:0 6px 18px rgba(0,0,0,0.3); }
  .hud-turn .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold-bright); box-shadow:0 0 8px var(--gold-bright); }
  .hud-turn .who{ font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:18px; color:var(--gold-bright); }
  .hud-turn .lbl{ font-family:'Space Mono', monospace; font-size:10px; color:rgba(246,239,225,0.5); letter-spacing:0.06em; }

  .hud-bottom{ position:absolute; bottom:26px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:13px; z-index:6; pointer-events:none; }
  .hint-txt{ font-size:11.5px; color:rgba(246,239,225,0.55); font-family:'Space Mono', monospace; background:rgba(6,20,15,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:6px 16px; border-radius:20px; text-align:center; }
  .hint-txt b{ color:var(--gold-bright); font-weight:700; }
  .tray-controls{ pointer-events:auto; display:flex; align-items:center; gap:20px; background:rgba(6,20,15,0.4); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:10px 16px 10px 22px; border-radius:50px; border:1px solid var(--line); box-shadow:0 10px 26px rgba(0,0,0,0.35); }
  .roll-btn{
    font-family:'Fraunces', serif; font-weight:700; font-size:17px; padding:13px 30px; border-radius:40px; border:none;
    background: linear-gradient(160deg, var(--gold-bright), var(--gold)); color:var(--ink); box-shadow:0 8px 18px rgba(205,165,72,0.4); letter-spacing:0.01em; transition:transform .12s ease;
  }
  .roll-btn:hover:not(:disabled){transform:translateY(-2px);}
  .roll-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}
  .validate-btn{
    background:transparent; color:var(--gold-bright); border:2px solid var(--gold);
    box-shadow:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .validate-btn:hover:not(:disabled){ background:rgba(205,165,72,0.12); }
  .rolls-left{ display:flex; gap:6px; }
  .pip-roll{ width:9px; height:9px; border-radius:50%; background:rgba(246,239,225,0.2); border:1px solid var(--line); }
  .pip-roll.used{background:var(--gold); border-color:var(--gold);}
</style>
</head>
<body>

<div class="rotate-lock">
  <div class="icon">📱</div>
  <div class="hud-title">Tournez votre appareil</div>
  <p>Ce jeu se joue uniquement en mode paysage, pour profiter pleinement du plateau et de la feuille de score.</p>
</div>

<div class="app" id="appRoot">
  <aside class="sidebar">
    <div class="score-title" id="scoreTitle">Scores</div>
    <div class="score-wrap" id="scoreWrap"></div>
  </aside>

  <main class="main" id="main">
    <div id="setupScreen" class="screen-pad" style="display:none;"></div>

    <div id="gameScreen" class="game-screen" style="display:none;">
      <div class="tray-3d" id="tray3d">
        <div class="loading3d" id="loading3d">Installation de la table…</div>
        <div class="hud-held" id="hudHeld">Dés gardés</div>
      </div>
      <div class="hud-top">
        <div class="hud-title">Yahtzee</div>
        <div class="hud-right">
          <div class="hud-round" id="hudRound">Manche 1 / 13</div>
          <button class="fs-btn" id="fullscreenBtn" title="Plein écran">⛶</button>
          <button class="btn ghost new-game-btn-top" id="homeBtn">⌂ Accueil</button>
          <button class="btn ghost new-game-btn-top" id="newGameBtn">↺ Nouvelle partie</button>
        </div>

/* ============================================================
   YAHTZEE — logique de jeu, feuille de score, persistance

const STORAGE_GAME_KEY = "yahtzee:current-game";
const STORAGE_PROFILES_KEY = "yahtzee:profiles";

const UPPER_CATS = [
  {id:"aces", label:"As", hint:"Somme des 1", calc:d=>sumOf(d,1)},
  {id:"twos", label:"Deux", hint:"Somme des 2", calc:d=>sumOf(d,2)},
  {id:"threes", label:"Trois", hint:"Somme des 3", calc:d=>sumOf(d,3)},
  {id:"fours", label:"Quatre", hint:"Somme des 4", calc:d=>sumOf(d,4)},
  {id:"fives", label:"Cinq", hint:"Somme des 5", calc:d=>sumOf(d,5)},
  {id:"sixes", label:"Six", hint:"Somme des 6", calc:d=>sumOf(d,6)},
];
const LOWER_CATS = [
  {id:"threeKind", label:"Brelan", hint:"3 identiques → somme totale", calc:d=>hasNOfKind(d,3)?sumAll(d):0},
  {id:"fourKind", label:"Carré", hint:"4 identiques → somme totale", calc:d=>hasNOfKind(d,4)?sumAll(d):0},
  {id:"fullHouse", label:"Full", hint:"3 + 2 → 25 pts", calc:d=>isFullHouse(d)?25:0},
  {id:"smallStraight", label:"Petite suite", hint:"4 consécutifs → 30 pts", calc:d=>hasStraight(d,4)?30:0},
  {id:"largeStraight", label:"Grande suite", hint:"5 consécutifs → 40 pts", calc:d=>hasStraight(d,5)?40:0},
  {id:"yahtzee", label:"Yahtzee", hint:"5 identiques → 50 pts", calc:d=>hasNOfKind(d,5)?50:0},
  {id:"chance", label:"Chance", hint:"Somme totale", calc:d=>sumAll(d)},
];
const ALL_CATS = [...UPPER_CATS, ...LOWER_CATS];

function sumOf(dice, face){ return dice.filter(v=>v===face).reduce((a,b)=>a+b,0); }
function sumAll(dice){ return dice.reduce((a,b)=>a+b,0); }
function counts(dice){ const c={}; dice.forEach(v=>c[v]=(c[v]||0)+1); return c; }
function hasNOfKind(dice, n){ return Object.values(counts(dice)).some(c=>c>=n); }
function isFullHouse(dice){
  const c = Object.values(counts(dice)).sort();
  return (c.length===2 && c[0]===2 && c[1]===3) || (c.length===1 && c[0]===5);
}
function hasStraight(dice, len){
  const uniq = [...new Set(dice)].sort((a,b)=>a-b);
  let run=1, best=1;
  for(let i=1;i<uniq.length;i++){ if(uniq[i]===uniq[i-1]+1){ run++; best=Math.max(best,run); } else { run=1; } }
  return best>=len;
}

let profiles = {};
let setupNames = [];

function uid(){ return Math.random().toString(36).slice(2,9); }
function newDice(game){ return Array(diceCountFor(game)).fill(1); }

/* ---------- Catégories Yatzy (en plus du Yahtzee existant, défini plus bas) ---------- */
function highestPairValue(dice){
  const c = counts(dice);
  const vals = Object.keys(c).map(Number).filter(v=>c[v]>=2);
  return vals.length ? Math.max(...vals) : 0;
}
function twoPairsSum(dice){
  const c = counts(dice);
  const vals = Object.keys(c).map(Number).filter(v=>c[v]>=2).sort((a,b)=>b-a);
  if(vals.length<2) return 0;
  return vals[0]*2 + vals[1]*2;
}
function nOfKindSum(dice, n){
  const c = counts(dice);
  const vals = Object.keys(c).map(Number).filter(v=>c[v]>=n).sort((a,b)=>b-a);
  return vals.length ? vals[0]*n : 0;
}
function isFullHouseYatzy(dice){
  const c = Object.values(counts(dice)).sort();
  return (c.length===2 && c[0]===2 && c[1]===3) || (c.length===1 && c[0]===5);
}
const YATZY_LOWER_CATS = [
  {id:"onePair", label:"Une paire", hint:"Somme de la paire la plus haute", calc:d=>highestPairValue(d)*2},
  {id:"twoPairs", label:"Deux paires", hint:"Somme des deux paires", calc:d=>twoPairsSum(d)},
  {id:"threeKindY", label:"Brelan", hint:"Somme des 3 dés seulement", calc:d=>nOfKindSum(d,3)},
  {id:"fourKindY", label:"Carré", hint:"Somme des 4 dés seulement", calc:d=>nOfKindSum(d,4)},
  {id:"smallStraight", label:"Petite suite", hint:"1-2-3-4-5 → 15 pts", calc:d=>[...d].sort().join(",")==="1,2,3,4,5"?15:0},
  {id:"largeStraight", label:"Grande suite", hint:"2-3-4-5-6 → 20 pts", calc:d=>[...d].sort().join(",")==="2,3,4,5,6"?20:0},
  {id:"fullHouseY", label:"Full", hint:"Somme des 5 dés", calc:d=>isFullHouseYatzy(d)?sumAll(d):0},
  {id:"chanceY", label:"Chance", hint:"Somme des 5 dés", calc:d=>sumAll(d)},
  {id:"yatzy", label:"Yatzy", hint:"5 identiques → somme + 50 pts", calc:d=>hasNOfKind(d,5)?sumAll(d)+50:0},
];

function gameCats(){
  if(state && state.game==="yatzy") return { upper:UPPER_CATS, lower:YATZY_LOWER_CATS, bonusAmount:50 };
  return { upper:UPPER_CATS, lower:LOWER_CATS, bonusAmount:35 }; // Yahtzee par défaut
}
function allCatsFor(){ const g=gameCats(); return [...g.upper, ...g.lower]; }

function freshGame(names, game){

      dice: Array(n).fill(1), held: Array(n).fill(false), rollsUsed: 0, rollStarted: false,
      results: {}, lastRoundSummary: null, eliminatedOrder: [], gameOver: false,
    };

    game,
    players: names.map(nm=>({id:uid(), name:nm, scores:{}, bonusYz:0})),

}

let storageWorks = null;   // null=pas encore testé, true/false=résultat constaté
let storageVia = null;     // 'cloud' (compte Claude) ou 'local' (navigateur) ou null
function markStorageStatus(ok, via){
  storageWorks = ok;
  storageVia = ok ? via : null;
  updateStorageBadge();
}

/* Stockage à deux niveaux :
   1) window.storage — sauvegarde liée au compte Claude, fonctionne dans l'aperçu Claude.ai.
   2) localStorage — repli automatique pour quand le fichier est ouvert seul dans un navigateur
      (là où window.storage n'existe pas mais où localStorage fonctionne normalement). */
async function storagePut(key, value){
  try{
    if(window.storage){
      const r = await window.storage.set(key, value, false);
      if(r){ markStorageStatus(true, "cloud"); return; }
    }
  }catch(e){ console.warn("window.storage indisponible, repli sur le stockage local :", e); }
  try{
    localStorage.setItem(key, value);
    markStorageStatus(true, "local");
  }catch(e){
    console.error("Aucun stockage disponible (ni compte, ni navigateur) :", e);
    markStorageStatus(false, null);
  }
}
async function storageTake(key){
  try{
    if(window.storage){
      const r = await window.storage.get(key, false);
      if(r && r.value){ markStorageStatus(true, "cloud"); return r.value; }
    }
  }catch(e){ /* on tente le repli local */ }
  try{
    const v = localStorage.getItem(key);
    if(v !== null){ markStorageStatus(true, "local"); return v; }
    markStorageStatus(true, storageVia || "cloud");
  }catch(e){
    console.error("Aucun stockage disponible pour la lecture :", e);
    markStorageStatus(false, null);
  }
  return null;
}
async function storageWipe(key){
  try{ if(window.storage) await window.storage.delete(key, false); }catch(e){}
  try{ localStorage.removeItem(key); }catch(e){}
}

async function saveGame(){ await storagePut(STORAGE_GAME_KEY, JSON.stringify(state)); }
async function loadGame(){
  const v = await storageTake(STORAGE_GAME_KEY);

}
async function saveProfiles(){ await storagePut(STORAGE_PROFILES_KEY, JSON.stringify(profiles)); }

}
function isTouchTablet(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function updateStorageBadge(){
  const badge = document.getElementById("storageBadge");
  const statusText = document.getElementById("storageStatusText");
  const onIpad = isTouchTablet();
  if(storageWorks === false){
    const warn = "⚠ La sauvegarde automatique ne fonctionne pas dans ce contexte. Utilisez l'export / import ci-dessous pour ne rien perdre.";
    if(badge){ badge.style.display = "block"; badge.textContent = warn; }
    if(statusText){ statusText.textContent = "Sauvegarde automatique : indisponible ici. Exportez régulièrement votre sauvegarde ci-dessous."; statusText.style.color = "#f0c98a"; }
  } else if(storageWorks === true){
    if(badge) badge.style.display = "none";
    if(statusText){
      if(storageVia === "local"){
        statusText.textContent = "Sauvegarde automatique : active, dans ce navigateur (cet appareil uniquement). Rejouer depuis un autre appareil ou navigateur ne la retrouvera pas — pensez à exporter un fichier pour la transporter.";
      } else {
        statusText.textContent = "Sauvegarde automatique : active." + (onIpad ? " Sur iPad, jouez depuis Claude (Safari ou l'app) pour qu'elle continue de fonctionner." : "");
      }

    }
  } else {
    if(badge) badge.style.display = "none";
    if(statusText) statusText.textContent = "Vérification de la sauvegarde automatique…";
  }
}
function recordProfile(name, finalScore){
  const p = profiles[name] || {games:0, best:0, total:0};
  p.games += 1; p.total += finalScore; p.best = Math.max(p.best, finalScore);
  profiles[name] = p; saveProfiles();
}
function ensureProfile(name){
  if(!profiles[name]){ profiles[name] = {games:0, best:0, total:0}; return true; }
  return false;
}

let audioCtx;
function getAudioCtx(){ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function noiseBuffer(ctx, duration){
  const len = Math.max(1, Math.floor(ctx.sampleRate*duration));
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<len;i++){ data[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.6); }
  return buffer;
}
/* bruit sourd et feutré (dé en résine posé sur du tissu), pas un bip électronique */
function thud(strength){
  try{
    const ctx = getAudioCtx();
    const dur = 0.075 + Math.random()*0.035;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, dur);
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 320 + Math.random()*260 + strength*260;
    filter.Q.value = 0.5;
    const gain = ctx.createGain();
    const vol = Math.min(0.3, 0.05 + strength*0.22);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
  }catch(e){}
}
function throwSound(){ for(let i=0;i<3;i++) setTimeout(()=>thud(0.35+Math.random()*0.25), i*35); }
function bounceTick(strength){ thud(Math.max(0.12, Math.min(1, strength))); }

function upperSubtotal(player){ return UPPER_CATS.reduce((s,c)=> s + (player.scores[c.id] ?? 0), 0); }

function lowerSubtotal(player){ return gameCats().lower.reduce((s,c)=> s + (player.scores[c.id] ?? 0), 0); }
function grandTotal(player){ return upperSubtotal(player) + upperBonus(player) + lowerSubtotal(player) + (state.game==="yahtzee" ? (player.bonusYz||0)*100 : 0); }
function roundNumber(player){ return Object.keys(player.scores).length + 1; }

function renderCategoryRow(cat){
  const players = state.players;
  let html = `<tr><td class="cat-col">${cat.label}<span class="cat-hint">${cat.hint}</span></td>`;
  players.forEach((p,i)=>{
    const isActivePlayer = (i===state.current && !state.gameOver);
    const activeCls = isActivePlayer ? "active-col" : "";
    const used = p.scores[cat.id] !== undefined;
    if(used){
      html += `<td class="cell ${activeCls}">${p.scores[cat.id]}</td>`;
    } else if(isActivePlayer && state.rollStarted){
      const potential = cat.calc(state.dice);
      const zeroCls = potential===0 ? "zero" : "";
      html += `<td class="cell ${activeCls} choosable"><span class="cell-ghost">·</span><button class="score-pick ${zeroCls}" data-cat="${cat.id}" title="Valider ${cat.label} pour ${potential} points">${potential}</button></td>`;
    } else {
      html += `<td class="cell ${activeCls} empty">—</td>`;
    }
  });
  html += `</tr>`;
  return html;
}

const P421_COMBO = {
  421: {label:"421", value:10},
  as: {label:"Brelan d'As", value:7},
  brelan: {label:"Brelan de", value:0}, // value calculé
  suite456: {label:"Suite 4-5-6", value:2},
  suite345: {label:"Suite 3-4-5", value:1},
  suite234: {label:"Suite 2-3-4", value:1},
  suite123: {label:"Suite 1-2-3", value:1},
  points: {label:"Points", value:1},
  nenette: {label:"Nénette (2-2-1)", value:1},
};
function evaluate421(dice){
  const sorted = [...dice].sort((a,b)=>b-a);
  const key = sorted.join(",");
  const set = new Set(dice);
  if(set.size===3 && dice.includes(4) && dice.includes(2) && dice.includes(1)){
    return {rankNum:6000, label:"421", value:10};
  }
  const c = counts(dice);
  const tripleVal = Object.keys(c).map(Number).find(v=>c[v]>=3);
  if(tripleVal){
    if(tripleVal===1) return {rankNum:5000, label:"Brelan d'As", value:7};
    return {rankNum:4000+tripleVal, label:`Brelan de ${tripleVal}`, value:tripleVal};
  }
  if(key==="6,5,4") return {rankNum:3004, label:"Suite 4-5-6", value:2};
  if(key==="5,4,3") return {rankNum:3003, label:"Suite 3-4-5", value:1};
  if(key==="4,3,2") return {rankNum:3002, label:"Suite 2-3-4", value:1};
  if(key==="3,2,1") return {rankNum:3001, label:"Suite 1-2-3", value:1};
  if(key==="2,2,1") return {rankNum:1000, label:"Nénette", value:1};
  const pointsRank = 2000 + sorted[0]*100 + sorted[1]*10 + sorted[2];
  return {rankNum:pointsRank, label:`Points ${sorted.join("-")}`, value:1};
}
function compare421(a,b){ return a.rankNum - b.rankNum; } // >0 si a bat b

function start421Round(){
  const n = state.players.length;
  state.order = Array.from({length:n}, (_,i)=> (state.roundStarter+i)%n);
  state.turnIdx = 0;
  state.rollCap = null;
  state.results = {};
  state.rollsUsed = 0;
  state.rollStarted = false;
  state.dice = Array(3).fill(1);
  state.held = [false,false,false];
}

function currentPlayer421(){ return state.players[state.order[state.turnIdx]]; }

function validate421Turn(){
  if(!state || state.game!=="421" || !state.rollStarted) return;
  const playerIdx = state.order[state.turnIdx];
  state.results[playerIdx] = { dice:[...state.dice], combo: evaluate421(state.dice), rolls: state.rollsUsed };
  if(state.turnIdx===0){ state.rollCap = state.rollsUsed; }
  state.turnIdx += 1;
  if(state.turnIdx >= state.order.length){
    resolve421Round();
  } else {
    state.rollsUsed = 0;
    state.rollStarted = false;
    state.held = [false,false,false];
    state.dice = Array(3).fill(1);
    saveGame();
    resetDiceForNewTurn();
    renderAll();
  }
}

function resolve421Round(){
  const entries = state.order.map(pIdx => ({ pIdx, ...state.results[pIdx] }));
  let best = entries[0], worst = entries[0];
  entries.forEach(e=>{
    if(compare421(e.combo, best.combo) > 0) best = e;
    if(compare421(e.combo, worst.combo) < 0) worst = e;
  });
  const transferValue = best.combo.value;
  const phaseAtStart = state.phase;
  let transferAmount = 0;
  if(phaseAtStart === "charge"){
    transferAmount = Math.min(transferValue, state.pot);
    state.tokens[worst.pIdx] += transferAmount;
    state.pot -= transferAmount;
  } else {
    transferAmount = Math.min(transferValue, state.tokens[best.pIdx]);
    state.tokens[best.pIdx] -= transferAmount;
    state.tokens[worst.pIdx] += transferAmount;
  }
  state.lastRoundSummary = {
    phase: phaseAtStart,
    bestName: state.players[best.pIdx].name, bestCombo: best.combo.label,
    worstName: state.players[worst.pIdx].name, worstCombo: worst.combo.label,
    transferAmount,
  };
  state.roundStarter = worst.pIdx;

  if(phaseAtStart==="charge" && state.pot<=0){ state.phase = "decharge"; }

  if(state.phase==="decharge"){
    state.players.forEach((p,i)=>{
      if(state.tokens[i]===0 && !state.eliminatedOrder.includes(i)) state.eliminatedOrder.push(i);
    });
    const remaining = state.players.map((_,i)=>i).filter(i=> !state.eliminatedOrder.includes(i));
    if(remaining.length<=1){
      state.gameOver = true;
      saveGame();
      renderAll();
      return;
    }
    // le prochain départ doit être un joueur encore en jeu
    if(state.eliminatedOrder.includes(state.roundStarter)){
      state.roundStarter = remaining[0];
    }
  }

  start421Round();
  saveGame();
  resetDiceForNewTurn();
  renderAll();
}

function createShadowTexture(){
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  grad.addColorStop(0, "rgba(0,0,0,0.5)");
  grad.addColorStop(0.7, "rgba(0,0,0,0.22)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}

function createGlowTexture(hex){
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const c = new THREE.Color(hex);
  const r = Math.round(c.r*255), g = Math.round(c.g*255), b = Math.round(c.b*255);
  const grad = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  grad.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
  grad.addColorStop(0.45, `rgba(${r},${g},${b},0.35)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}

function createRoundedBoxGeometry(size, radius, segments){
  const geo = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
  const pos = geo.attributes.position;
  const inner = size/2 - radius;
  const v = new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    const qx = THREE.MathUtils.clamp(v.x, -inner, inner);
    const qy = THREE.MathUtils.clamp(v.y, -inner, inner);
    const qz = THREE.MathUtils.clamp(v.z, -inner, inner);
    const dx=v.x-qx, dy=v.y-qy, dz=v.z-qz;
    const dlen = Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dlen>1e-6){
      const s = radius/dlen;
      pos.setXYZ(i, qx+dx*s, qy+dy*s, qz+dz*s);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

let sharedDieGeo, sharedPipGeo, sharedPipMat, sharedShadowGeo, sharedShadowTex, sharedHaloTex;
let diceRigCount = -1;

function ensureScene(){
  if(!sceneReady){
    sceneReady = true;
    const container = document.getElementById("tray3d");
    const loading = document.getElementById("loading3d");

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    raycaster = new THREE.Raycaster();
    clock = new THREE.Clock();

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    container.insertBefore(renderer.domElement, loading);
    if(loading) loading.remove();

    // lumières (uniquement pour les dés — le feutre reste en couleur plate, fidèle au fond de la page)
    scene.add(new THREE.HemisphereLight(0xbfe8d4, 0x0b2a1f, 0.55));
    const ambient = new THREE.AmbientLight(0xfff2d8, 0.32);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xfff7e6, 1.1);
    dirLight.position.set(3.4, 7.5, 3.8);
    scene.add(dirLight);
    const rim = new THREE.PointLight(0xe9c874, 0.5, 14);
    rim.position.set(-3.5, 2.6, -2.4);
    scene.add(rim);
    const rim2 = new THREE.PointLight(0x9fd8c0, 0.3, 14);
    rim2.position.set(3.2, 2.2, 2.8);
    scene.add(rim2);

    // feutre — couleur plate identique au fond de la page (non affectée par l'éclairage), surface infinie sans bordure
    const feltMat = new THREE.MeshBasicMaterial({ color:0x0a2a20 });
    const felt = new THREE.Mesh(new THREE.PlaneGeometry(BOUND_X*6, BOUND_Z*6), feltMat);
    felt.rotation.x = -Math.PI/2;
    scene.add(felt);
    // grain de feutre très subtil, lui aussi en couleur plate pour rester fidèle
    const speckleGeo = new THREE.CircleGeometry(0.02, 6);
    const speckleMat = new THREE.MeshBasicMaterial({ color:0x0e3728, transparent:true, opacity:0.35 });
    const speckleMesh = new THREE.InstancedMesh(speckleGeo, speckleMat, 140);
    const dummy = new THREE.Object3D();
    for(let i=0;i<140;i++){
      dummy.position.set((Math.random()-0.5)*BOUND_X*2.6, 0.001, (Math.random()-0.5)*BOUND_Z*2.6);
      dummy.rotation.x = -Math.PI/2;
      dummy.updateMatrix();
      speckleMesh.setMatrixAt(i, dummy.matrix);
    }
    scene.add(speckleMesh);

    // ressources partagées par tous les dés, quel que soit leur nombre
    sharedShadowTex = createShadowTexture();
    sharedHaloTex = createGlowTexture(0xe9c874);
    sharedShadowGeo = new THREE.PlaneGeometry(1,1);
    const dieSize = DIE_HALF*2;
    sharedDieGeo = createRoundedBoxGeometry(dieSize, dieSize*0.16, 7);
    const pipRadius = DIE_HALF*0.185;
    sharedPipGeo = new THREE.SphereGeometry(pipRadius, 16, 16);
    sharedPipMat = new THREE.MeshPhysicalMaterial({ color:0x201812, roughness:0.55, clearcoat:0.3, clearcoatRoughness:0.4 });

    // ligne de séparation discrète entre la zone de lancer et la bande des dés gardés
    const dividerX = (ROLL_MAX_X + HELD_X - HELD_STRIP_W/2) / 2;
    const divider = new THREE.Mesh(
      new THREE.PlaneGeometry(0.012, BOUND_Z*2),
      new THREE.MeshBasicMaterial({ color:0xcda548, transparent:true, opacity:0.28 })
    );
    divider.rotation.x = -Math.PI/2;
    divider.position.set(dividerX, 0.004, 0);
    scene.add(divider);

    renderer.domElement.style.cursor = "grab";
    renderer.domElement.addEventListener("pointerdown", onCanvasPointerDown);
    window.addEventListener("resize", ()=>{ resizeRenderer(); });
    const ro = new ResizeObserver(()=>resizeRenderer());
    ro.observe(container);

    requestAnimationFrame(animate);
  }
  buildDiceRig();
  resizeRenderer();
  positionHeldLabel();
}

function buildDiceRig(){
  if(diceRigCount === DICE_COUNT) return; // déjà le bon nombre de dés
  // on retire les dés existants (changement de jeu : 5 dés Yahtzee/Yatzy ↔ 3 dés au 421)
  diceStates.forEach(d=>{ scene.remove(d.mesh); scene.remove(d.shadowBlob); scene.remove(d.halo); });
  diceStates = [];

  const pipRadius = DIE_HALF*0.185;
  const offsets = buildNeutralOffsets(DICE_COUNT);
  const neutralX = offsets.map(o=>ROLL_CENTER_X+o.dx);
  const neutralZ = offsets.map(o=>0.32+o.dz);

  for(let i=0;i<DICE_COUNT;i++){
    const dieMat = new THREE.MeshPhysicalMaterial({
      color:0xf7f1e4, roughness:0.28, metalness:0.02,
      clearcoat:0.65, clearcoatRoughness:0.18, reflectivity:0.5, emissive:0x000000
    });
    const box = new THREE.Mesh(sharedDieGeo, dieMat);
    const group = new THREE.Group();
    group.add(box);

    const shadowBlob = new THREE.Mesh(sharedShadowGeo, new THREE.MeshBasicMaterial({ map:sharedShadowTex, transparent:true, depthWrite:false, opacity:0.4 }));
    shadowBlob.rotation.x = -Math.PI/2;
    shadowBlob.scale.set(DIE_HALF*3.4, DIE_HALF*3.4, 1);
    shadowBlob.position.set(neutralX[i], 0.003, neutralZ[i]);
    scene.add(shadowBlob);

    FACE_DIRS.forEach(face=>{
      const layout = PIP_LAYOUTS[face.val];
      layout.forEach((on, idx)=>{
        if(!on) return;
        const col = idx%3, row = Math.floor(idx/3);
        const px = (col-1)*DIE_HALF*0.56, py = (1-row)*DIE_HALF*0.56;
        const embed = pipRadius*0.55;
        const pos = face.n.clone().multiplyScalar(DIE_HALF-embed)
          .add(face.u.clone().multiplyScalar(px))
          .add(face.v.clone().multiplyScalar(py));
        const pip = new THREE.Mesh(sharedPipGeo, sharedPipMat);
        pip.position.copy(pos);
        group.add(pip);
      });
    });

    group.userData.dieIndex = i;
    scene.add(group);

    const halo = new THREE.Mesh(
      sharedShadowGeo,
      new THREE.MeshBasicMaterial({ map:sharedHaloTex, transparent:true, depthWrite:false, opacity:0 })
    );
    halo.rotation.x = -Math.PI/2;
    halo.position.set(neutralX[i], 0.006, neutralZ[i]);
    halo.visible = false;
    scene.add(halo);

    diceStates.push({
      mesh: group, material: dieMat, halo, shadowBlob,
      pos: new THREE.Vector3(neutralX[i], DIE_HALF, neutralZ[i]),
      vel: new THREE.Vector3(0,0,0),
      angVel: new THREE.Vector3(0,0,0),
      quat: staggeredQuatForValue(1, offsets[i].yaw),
      glideTarget: null,
      targetScale: 1, curScale: 1,
      held: false, settled: true, restTimer: 0, value: 1, age: 0,
    });
    diceStates[i].mesh.position.copy(diceStates[i].pos);
    diceStates[i].mesh.quaternion.copy(diceStates[i].quat);
  }
  diceRigCount = DICE_COUNT;
}

function positionHeldLabel(){
  const label = document.getElementById("hudHeld");
  if(!label || !camera || !renderer) return;
  const container = document.getElementById("tray3d");
  const w = container.clientWidth, h = container.clientHeight;
  if(w<=0||h<=0) return;
  const worldPos = new THREE.Vector3(HELD_X, DIE_HALF, -BOUND_Z+0.32);
  const proj = worldPos.clone().project(camera);
  const x = (proj.x*0.5+0.5)*w;
  const y = (1-(proj.y*0.5+0.5))*h;
  label.style.left = x+"px";
  label.style.top = y+"px";
}


function fitCamera(){
  const container = document.getElementById("tray3d");
  const w = container.clientWidth || 800, h = container.clientHeight || 500;
  const aspect = w/h;
  camera.aspect = aspect;
  const halfW = BOUND_X + 1.1, halfD = BOUND_Z + 1.1;
  const fovRad = camera.fov*Math.PI/180;
  const distForH = halfD/Math.tan(fovRad/2);
  const distForW = halfW/(Math.tan(fovRad/2)*aspect);
  const dist = Math.max(distForH, distForW, 6) * 1.12;
  camera.position.set(0, dist*0.94, dist*0.34);
  camera.lookAt(0, -0.1, 0);
  camera.updateProjectionMatrix();
}

function resizeRenderer(){
  if(!renderer) return;
  const container = document.getElementById("tray3d");
  const w = container.clientWidth, h = container.clientHeight;
  if(w<=0 || h<=0) return;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  fitCamera();
  positionHeldLabel();
}

function onCanvasPointerDown(e){
  if(!state || !state.rollStarted || state.gameOver || rollInProgress) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const mouse = new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(diceStates.map(d=>d.mesh), true);
  if(!hits.length) return;
  let obj = hits[0].object;
  while(obj && obj.userData.dieIndex===undefined){ obj = obj.parent; }
  if(!obj) return;
  const idx = obj.userData.dieIndex;
  if(!diceStates[idx].settled) return;
  toggleHold(idx);
  saveGame();
}

function toggleHold(idx){
  const d = diceStates[idx];
  if(!d.held){
    d.preHoldPos = d.pos.clone();
    d.preHoldQuat = d.quat.clone();
    d.targetQuat = canonicalQuatForValue(d.value);
  } else {
    d.targetQuat = null;
  }
  d.held = !d.held;
  state.held[idx] = d.held;
  updateHeldVisual(idx);
  layoutHeldSlots();
  if(!d.held && d.preHoldPos){ d.glideTarget = d.preHoldPos.clone(); }
}

function updateHeldVisual(i){
  const d = diceStates[i];
  d.targetScale = d.held ? 1.16 : 1;
  d.material.emissive.setHex(d.held ? 0x4a3812 : 0x000000);
  d.material.emissiveIntensity = d.held ? 0.35 : 0;
  if(d.held){ d.halo.visible = true; }
  // le halo reste visible pendant la transition de sortie, updateEffects() le masquera une fois l'opacité retombée
}

function layoutHeldSlots(){
  const heldIdx = [];
  for(let i=0;i<DICE_COUNT;i++) if(state.held[i]) heldIdx.push(i);
  const spacing = DIE_HALF*2.35;
  const topZ = -BOUND_Z + DIE_HALF*1.7;   // colonne ancrée en haut de l'écran (loin de la caméra)
  heldIdx.forEach((idx,slot)=>{
    diceStates[idx].glideTarget = new THREE.Vector3(HELD_X, DIE_HALF, topZ + slot*spacing);
  });
}

function getTopValue(quat){
  let best=-Infinity, bestVal=1, bestNormal=null;
  FACE_DIRS.forEach(f=>{
    const worldN = f.n.clone().applyQuaternion(quat);
    const dot = worldN.dot(UP);
    if(dot>best){ best=dot; bestVal=f.val; bestNormal=worldN; }
  });
  return { value:bestVal, normal:bestNormal };
}

/* Orientation "bien droite" d'un dé pour une valeur donnée : face du haut alignée
   ET les côtés parfaitement carrés avec la table (aucune rotation résiduelle). */
const _mLocal = new THREE.Matrix4(), _mTarget = new THREE.Matrix4();
function canonicalQuatForValue(value){
  const face = FACE_DIRS.find(f=>f.val===value);
  _mLocal.makeBasis(face.u, face.v, face.n);
  _mTarget.makeBasis(new THREE.Vector3(0,0,-1), new THREE.Vector3(-1,0,0), new THREE.Vector3(0,1,0));
  const mLocalInv = _mLocal.clone().transpose();
  const m = _mTarget.clone().multiply(mLocalInv);
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

function buildNeutralOffsets(n){
  // motif de base réutilisé et étendu au besoin : jamais deux dés alignés pile, ni trop serrés
  const base = [
    {dx:-2.85, dz:0.24, yaw:0.24},
    {dx:-1.42, dz:-0.20, yaw:-0.32},
    {dx:0.05, dz:0.28, yaw:0.15},
    {dx:1.48, dz:-0.24, yaw:-0.20},
    {dx:2.90, dz:0.16, yaw:0.28},
  ];
  if(n===5) return base;
  // pour un autre nombre de dés (ex. 3 au 421), on répartit uniformément avec le même esprit décalé
  const spacing = 1.55;
  const out = [];
  for(let i=0;i<n;i++){
    const dx = (i-(n-1)/2)*spacing;
    const dz = (i%2===0) ? 0.24 : -0.22;
    const yaw = (i%2===0) ? 0.24 : -0.28;
    out.push({dx, dz, yaw});
  }
  return out;
}
function staggeredQuatForValue(value, yaw){
  const q = canonicalQuatForValue(value);
  const yawQ = new THREE.Quaternion().setFromAxisAngle(UP, yaw);
  return yawQ.multiply(q);
}

function launchDie(i){
  const d = diceStates[i];
  d.held = false; d.settled = false; d.restTimer = 0; d.glideTarget = null; d.age = 0;
  updateHeldVisual(i);
  const cellW = (ROLL_RIGHT-ROLL_LEFT)/DICE_COUNT;
  const cx = ROLL_LEFT + cellW*(i+0.5);
  const x = cx + (Math.random()-0.5)*cellW*0.45;
  const zBiasPattern = [0.42,-0.34,0.48,-0.42,0.30];
  const zBias = zBiasPattern[i % zBiasPattern.length];   // chaque dé a aussi sa propre zone en profondeur
  const z = zBias*BOUND_Z*0.65 + (Math.random()-0.5)*0.35;
  d.pos.set(x, 2.4 + Math.random()*0.9, z);
  d.vel.set((Math.random()-0.5)*1.6, -1.2-Math.random()*0.6, (Math.random()-0.5)*1.6);
  d.angVel.set((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15);
  d.quat.setFromEuler(new THREE.Euler(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2));
}

function resetDiceForNewTurn(){
  if(!sceneReady) return;
  const offsets = buildNeutralOffsets(DICE_COUNT);
  diceStates.forEach((d,i)=>{
    const o = offsets[i];
    d.held=false; d.settled=true; d.restTimer=0; d.value=1; d.glideTarget=null; d.targetQuat=null;
    d.pos.set(ROLL_CENTER_X+o.dx, DIE_HALF, 0.32+o.dz);
    d.vel.set(0,0,0); d.angVel.set(0,0,0);
    d.quat.copy(staggeredQuatForValue(1, o.yaw));
    d.mesh.position.copy(d.pos);
    d.mesh.quaternion.copy(d.quat);
    updateHeldVisual(i);
  });
}

function restoreDiceFromState(){
  if(!sceneReady || !state) return;
  const offsets = buildNeutralOffsets(DICE_COUNT);
  diceStates.forEach((d,i)=>{
    const o = offsets[i];
    d.held = !!state.held[i];
    d.settled = true; d.restTimer = 0; d.glideTarget = null; d.targetQuat = null;
    d.value = state.dice[i];
    d.pos.set(ROLL_CENTER_X+o.dx, DIE_HALF, 0.32+o.dz);
    d.vel.set(0,0,0); d.angVel.set(0,0,0);
    d.quat.copy(d.held ? canonicalQuatForValue(d.value) : staggeredQuatForValue(d.value, o.yaw));
    d.mesh.position.copy(d.pos);
    d.mesh.quaternion.copy(d.quat);
    updateHeldVisual(i);
    d.curScale = d.targetScale;
    d.mesh.scale.setScalar(d.curScale);
    if(d.halo){
      d.halo.position.set(d.pos.x, 0.006, d.pos.z);
      d.halo.material.opacity = d.held ? 0.65 : 0;
      d.halo.visible = d.held;
    }
  });
  layoutHeldSlots();
  diceStates.forEach(d=>{ if(d.glideTarget){ d.pos.copy(d.glideTarget); d.mesh.position.copy(d.pos); d.mesh.quaternion.copy(d.quat); d.glideTarget=null; } });
}

function currentRollsLeft(){
  if(!state) return 0;
  if(state.game==="421"){ const cap = state.rollCap || 3; return Math.max(0, cap - state.rollsUsed); }
  return state.rollsLeft;
}

function doRoll(){
  if(!state || currentRollsLeft()<=0 || rollInProgress || !sceneReady) return;
  rollInProgress = true;
  const btn = document.getElementById("rollBtn");
  if(btn) btn.disabled = true;
  throwSound();
  for(let i=0;i<DICE_COUNT;i++){ if(!state.held[i]) launchDie(i); }
}
document.getElementById("rollBtn").onclick = doRoll;
document.getElementById("validateBtn").onclick = validate421Turn;

function resolveCollisions(){
  for(let pass=0; pass<5; pass++){
    for(let i=0;i<DICE_COUNT;i++){
      for(let j=i+1;j<DICE_COUNT;j++){
        const a=diceStates[i], b=diceStates[j];
        if(a.held||b.held) continue;
        const dx=b.pos.x-a.pos.x, dz=b.pos.z-a.pos.z;
        const dist=Math.hypot(dx,dz);
        if(dist>0.0001 && dist<MIN_SEP){
          const overlap=(MIN_SEP-dist)/2;
          const nx=dx/dist, nz=dz/dist;
          a.pos.x-=nx*overlap; a.pos.z-=nz*overlap;
          b.pos.x+=nx*overlap; b.pos.z+=nz*overlap;
          a.vel.x*=0.8; a.vel.z*=0.8; b.vel.x*=0.8; b.vel.z*=0.8;
        }
      }
    }
  }
}

function updateGlides(dt){
  diceStates.forEach(d=>{
    if(!d.glideTarget) return;
    d.pos.lerp(d.glideTarget, Math.min(1, dt*7));
    d.mesh.position.copy(d.pos);
    if(d.pos.distanceTo(d.glideTarget) < 0.008){
      d.pos.copy(d.glideTarget); d.mesh.position.copy(d.pos); d.glideTarget = null;
    }
  });
}

function forceSettle(d){
  const top = getTopValue(d.quat);
  const align = new THREE.Quaternion().setFromUnitVectors(top.normal.clone().normalize(), UP);
  d.quat.premultiply(align);
  d.pos.y = FLOOR_Y+DIE_HALF;
  d.pos.x = THREE.MathUtils.clamp(d.pos.x, -BOUND_X+DIE_HALF, ROLL_MAX_X-DIE_HALF);
  d.pos.z = THREE.MathUtils.clamp(d.pos.z, -BOUND_Z+DIE_HALF, BOUND_Z-DIE_HALF);
  d.vel.set(0,0,0); d.angVel.set(0,0,0);
  d.mesh.position.copy(d.pos);
  d.mesh.quaternion.copy(d.quat);
  d.value = top.value;
  d.settled = true;
  d.restTimer = 0;
}

function stepPhysics(dt){
  dt = Math.min(dt, 1/30);
  diceStates.forEach((d)=>{
    if(d.held || d.settled) return;
    d.age += dt;
    d.vel.y -= GRAVITY*dt;
    d.pos.addScaledVector(d.vel, dt);
    const angle = d.angVel.length()*dt;
    if(angle>0.00001){
      const axis = d.angVel.clone().normalize();
      const dq = new THREE.Quaternion().setFromAxisAngle(axis, angle);
      d.quat.premultiply(dq);
    }
    let bounced=false, impact=0;
    // zone de contact avec le sol (un peu de marge pour capter le repos, pas seulement l'impact)
    if(d.pos.y - DIE_HALF < FLOOR_Y + 0.004){
      if(d.vel.y < -0.55){
        // vrai rebond
        impact = -d.vel.y;
        d.pos.y = FLOOR_Y + DIE_HALF;
        d.vel.y = -d.vel.y*0.38;
        d.vel.x *= 0.72; d.vel.z *= 0.72;
        d.angVel.multiplyScalar(0.55);
        bounced = impact>0.3;
      } else {
        // contact / roulement au sol : on colle au plateau et on freine fort en continu
        d.pos.y = FLOOR_Y + DIE_HALF;
        d.vel.y = Math.max(d.vel.y, 0) * 0.2;
        const groundFriction = Math.pow(0.015, dt);   // décroissance forte par seconde
        const spinFriction   = Math.pow(0.01, dt);
        d.vel.x *= groundFriction; d.vel.z *= groundFriction;
        d.angVel.multiplyScalar(spinFriction);
      }
    }
    if(d.pos.x - DIE_HALF < -BOUND_X){ d.pos.x=-BOUND_X+DIE_HALF; d.vel.x=Math.abs(d.vel.x)*0.5; }
    if(d.pos.x + DIE_HALF >  ROLL_MAX_X){ d.pos.x= ROLL_MAX_X-DIE_HALF; d.vel.x=-Math.abs(d.vel.x)*0.5; }
    if(d.pos.z - DIE_HALF < -BOUND_Z){ d.pos.z=-BOUND_Z+DIE_HALF; d.vel.z=Math.abs(d.vel.z)*0.5; }
    if(d.pos.z + DIE_HALF >  BOUND_Z){ d.pos.z= BOUND_Z-DIE_HALF; d.vel.z=-Math.abs(d.vel.z)*0.5; }
    if(bounced && Math.random()<0.55) bounceTick(Math.min(1,impact/6));
    d.vel.multiplyScalar(0.99);
    d.angVel.multiplyScalar(0.96);
  });

  resolveCollisions();

  diceStates.forEach((d)=>{
    if(d.held || d.settled) return;
    d.mesh.position.copy(d.pos);
    d.mesh.quaternion.copy(d.quat);
    const onFloor = Math.abs(d.pos.y-(FLOOR_Y+DIE_HALF)) < 0.012;
    const slow = d.vel.length()<0.16 && d.angVel.length()<0.22;
    if(onFloor && slow){
      d.restTimer += dt;
      if(d.restTimer>0.16){ forceSettle(d); }
    } else {
      d.restTimer = 0;
    }
    // garde-fou : quoi qu'il arrive, un dé ne roule jamais plus de 3 secondes
    if(!d.settled && d.age > 3.0){ forceSettle(d); }
  });

  updateGlides(dt);
}

function checkRollComplete(){
  if(!rollInProgress) return;
  const allDone = diceStates.every((d,i)=> (state && state.held[i]) || d.settled);
  if(!allDone) return;
  rollInProgress = false;
  state.dice = diceStates.map(d=>d.value);
  if(state.game==="421"){
    state.rollsUsed += 1;
    state.rollStarted = true;
    saveGame();
    render421Header();
  } else {
    state.rollsLeft -= 1;
    state.rollStarted = true;
    saveGame();
    renderScoreTable();
    renderGameHeader();
  }
}

function updateShadowBlobs(){
  diceStates.forEach(d=>{
    if(!d.shadowBlob) return;
    const h = Math.max(0, d.pos.y - DIE_HALF);
    const s = THREE.MathUtils.clamp(1 - h*0.32, 0.4, 1);
    d.shadowBlob.position.set(d.pos.x, 0.003, d.pos.z);
    d.shadowBlob.scale.set(DIE_HALF*3.4*s, DIE_HALF*3.4*s, 1);
    d.shadowBlob.material.opacity = THREE.MathUtils.clamp(0.42 - h*0.1, 0.06, 0.42);
  });
}

function updateSelectionEffects(dt, elapsed){
  diceStates.forEach(d=>{
    // léger agrandissement du dé lorsqu'il est sélectionné
    d.curScale = THREE.MathUtils.lerp(d.curScale, d.targetScale, Math.min(1, dt*9));
    d.mesh.scale.setScalar(d.curScale);

    // redressement en douceur vers une orientation bien droite dans la zone réservée
    if(d.targetQuat){
      d.quat.slerp(d.targetQuat, Math.min(1, dt*7));
      d.mesh.quaternion.copy(d.quat);
      if(d.quat.angleTo(d.targetQuat) < 0.01){ d.quat.copy(d.targetQuat); d.mesh.quaternion.copy(d.quat); d.targetQuat = null; }
    }

    // halo doré au sol, pulsant doucement, toujours à plat quelle que soit l'orientation du dé
    if(!d.halo) return;
    const pulse = 0.5 + 0.5*Math.sin(elapsed*3.1 + d.mesh.id*0.7);
    const targetOpacity = d.held ? (0.55 + pulse*0.25) : 0;
    d.halo.material.opacity = THREE.MathUtils.lerp(d.halo.material.opacity, targetOpacity, Math.min(1, dt*8));
    const targetScaleHalo = DIE_HALF*(4.4 + pulse*0.5);
    d.halo.scale.set(targetScaleHalo, targetScaleHalo, 1);
    d.halo.position.set(d.pos.x, 0.006, d.pos.z);
    if(!d.held && d.halo.material.opacity < 0.01){ d.halo.visible = false; }
  });
}

function animate(){
  requestAnimationFrame(animate);
  if(!sceneReady) return;
  const dt = clock.getDelta();
  if(sceneActive){
    stepPhysics(dt);
    checkRollComplete();
    updateShadowBlobs();
    updateSelectionEffects(dt, clock.elapsedTime);
    renderer.render(scene, camera);
  }
}

/* ---------- Plein écran ---------- */
const fsBtn = document.getElementById("fullscreenBtn");
function fsIsEnabled(){
  return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled);
}
function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
}
function requestFs(el){
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(!fn) return Promise.reject(new Error("no fullscreen api"));
  const res = fn.call(el);
  return res && res.then ? res : Promise.resolve();
}
function exitFs(){
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if(fn) return fn.call(document);
  return Promise.resolve();
}
function showFsHint(){
  // le plein écran n'est pas disponible dans ce contexte : on n'affiche plus rien en bas, échec silencieux.
  console.warn("Plein écran indisponible dans ce contexte.");
}
if(fsBtn){
  fsBtn.onclick = ()=>{
    if(!fsElement()){
      if(!fsIsEnabled()){ showFsHint(); return; }
      requestFs(document.documentElement).catch(showFsHint);
    } else {
      exitFs();
    }
  };
  ["fullscreenchange","webkitfullscreenchange","mozfullscreenchange","MSFullscreenChange"].forEach(evt=>{
    document.addEventListener(evt, ()=>{
      const on = !!fsElement();
      fsBtn.textContent = on ? "⤢" : "⛶";
      fsBtn.title = on ? "Quitter le plein écran" : "Plein écran";
    });
  });
}

/* ---------- Protection contre la perte de partie (rafraîchissement / fermeture) ---------- */
window.addEventListener("beforeunload", (e)=>{
  if(state && !state.gameOver){
    e.preventDefault();
    e.returnValue = "";
  }
});
window.addEventListener("keydown", (e)=>{
  const isRefresh = e.key==="F5" || ((e.ctrlKey||e.metaKey) && (e.key==="r"||e.key==="R"));
  if(isRefresh && state && !state.gameOver){ e.preventDefault(); }
});

// Empêche le geste "tirer pour actualiser" de Safari/iPad : la page entière ne doit jamais
// pouvoir rebondir/défiler, sinon ce geste déclenche un rechargement et efface la partie.
// On laisse passer les gestes uniquement à l'intérieur de la feuille de score (score-wrap),
// qui peut avoir son propre défilement interne si beaucoup de joueurs sont présents.
document.addEventListener("touchmove", (e)=>{
  let el = e.target;
  while(el && el !== document.body){
    if(el.classList && el.classList.contains("score-wrap")) return;
    el = el.parentElement;
  }
  e.preventDefault();
}, { passive:false });

/* ---------- Init ---------- */
(async function init(){
  profiles = await loadProfiles();
  const saved = await loadGame();
  if(saved && !saved.gameOver){ state = saved; selectedGame = state.game || "yahtzee"; }
  else if(saved && saved.gameOver){ state = null; }
  renderAll();
  requestAnimationFrame(()=>{
    ensureSceneAndSync();
  });
})();
</script>
